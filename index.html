/* ═════════════════════════════════════════════
   スタイル
   ═════════════════════════════════════════════ */
const CSS = `
.app{
  --cream:#FFF6E5; --paper:#FFFFFF; --sand:#FBEFDA;
  --ink:#3B2F26; --sub:#8D7C6A; --line:#E8DBC4;
  --orange:#F0983C; --amber:#F5C63D; --mint:#2FB5A4; --red:#E2453C;
  --sky:#D3E8F0; --wood:#EBBD75; --wood-2:#D69B45;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  background:var(--cream); color:var(--ink);
  min-height:100%; padding:16px 16px 36px; box-sizing:border-box;
  max-width:720px; margin:0 auto;
}
.app *{box-sizing:border-box}
.app button{font-family:inherit}
.app button:focus-visible{outline:3px solid var(--mint); outline-offset:3px}

/* ── トップ画面 ── */
.hero{padding:16px 4px 24px}
.hero-eyebrow{font-size:11px; letter-spacing:.2em; color:var(--sub); font-weight:800}
.hero-title{
  margin:8px 0 0; font-size:clamp(30px, 10.5vw, 44px); line-height:1.1;
  font-weight:800; letter-spacing:.01em; color:var(--ink); white-space:nowrap;
}
.hero-title::after{
  content:""; display:block; width:64px; height:6px; margin-top:12px;
  background:var(--orange); border-radius:3px;
}
.hero-score{margin-top:16px}
.hero-score-label{font-size:11px; letter-spacing:.16em; color:var(--sub); font-weight:800}
.hero-score-num{margin-left:10px; font-size:26px; font-weight:800; color:var(--orange)}
.cards{display:flex; flex-direction:column; gap:10px}
.card{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  padding:14px 16px; border-radius:18px; background:var(--paper);
  border:2px solid var(--line); color:var(--ink);
  box-shadow:0 3px 0 var(--line);
  transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.card:hover{transform:translateY(-2px); border-color:var(--orange); box-shadow:0 5px 0 #F3D6A8}
.card:active{transform:translateY(1px); box-shadow:0 1px 0 var(--line)}
.card-icon{width:40px; height:46px; flex:none}
.card-icon .pin-body{stroke:#B9A98F; stroke-width:3; stroke-linejoin:round}
.ico-line{fill:none; stroke:#D3DAE1; stroke-width:3}
.card-text{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0}
.card-name{font-size:18px; font-weight:800}
.card-desc{font-size:12px; color:var(--sub)}
.card-go{font-size:26px; color:#C9BBA6; line-height:1}
.home-note{margin:22px 4px 0; font-size:12px; color:var(--sub); line-height:1.8}

/* ── ゲーム共通 ── */
.topbar{display:flex; align-items:center; gap:12px; padding:2px 0 14px}
.back{
  width:38px; height:38px; border-radius:50%; flex:none; cursor:pointer;
  background:var(--paper); border:2px solid var(--line); color:var(--ink);
  font-size:22px; line-height:1; padding-bottom:3px;
}
.topbar-title{flex:1; font-size:17px; font-weight:800; letter-spacing:.03em}
.topbar-score{font-size:22px; font-weight:800; color:var(--orange)}

.prog{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:12px}
.slot{
  min-width:34px; padding:5px; border-radius:9px; text-align:center;
  font-size:15px; font-weight:800;
  background:var(--sand); color:#B5A491; border:2px solid var(--line);
  transition:background .25s ease, color .25s ease, transform .25s ease;
}
.slot.is-given{background:var(--paper); color:var(--ink); border-color:#C9B79B; border-style:dashed}
.slot.is-open{background:var(--amber); color:var(--ink); border-color:var(--amber); border-style:solid; transform:translateY(-2px)}

.stage{position:relative}
.stage.is-miss{animation:shake .4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)}
}

/* ── ボウリング ── */
.lane{
  position:relative; height:320px; border-radius:18px; overflow:hidden;
  background:var(--sky); border:2px solid var(--line);
}
.lane-boards{
  position:absolute; inset:0;
  clip-path:polygon(36% 5%, 64% 5%, 100% 100%, 0% 100%);
  background:
    repeating-linear-gradient(90deg, rgba(140,95,35,.13) 0 1px, transparent 1px 26px),
    linear-gradient(180deg, var(--wood-2) 0%, var(--wood) 55%, #F6D6A2 100%);
}
.pins{position:absolute; inset:0}
.pin-slot{position:absolute; top:7%; transform:translateX(-50%)}
.pin{width:42px; transform-origin:50% 100%}
.pin-inner{position:relative; transform-origin:50% 100%;
  transition:transform .34s cubic-bezier(.3,1.4,.5,1), opacity .34s ease}
.pin-svg{display:block; width:42px; height:105px; filter:drop-shadow(0 5px 5px rgba(90,60,20,.28))}
.pin-body{fill:#FFFFFF}
.pin-stripe{fill:var(--red)}
.pin-label{
  position:absolute; top:-13px; left:50%; transform:translateX(-50%);
  width:32px; height:32px; border-radius:50%;
  background:#FFFFFF; border:2.5px solid var(--ink); color:var(--ink);
  font-size:14px; font-weight:800; display:grid; place-items:center; z-index:2;
}
.pin-label.is-hidden{background:#E7EDF1; color:#9AA6B2; border-color:#9AA6B2}
.pin--hit .pin-inner{transform:translateY(-4px) rotate(-4deg)}
.pin--down .pin-inner{transform:rotate(-82deg) translate(-16px,10px); opacity:.6}
.ball{
  position:absolute; left:50%; bottom:6%; width:58px; height:58px; margin-left:-29px;
  border-radius:50%; background:radial-gradient(circle at 32% 28%, #7FC1DE, #2E6E93 70%);
  box-shadow:0 6px 10px rgba(60,90,110,.35), inset -6px -8px 14px rgba(20,60,90,.35);
  transition:left .3s ease-out, bottom .3s ease-out, transform .3s ease-out;
  display:flex; gap:4px; align-items:center; justify-content:center; padding-bottom:10px;
}
.ball.is-rolling{bottom:60%; transform:scale(.5) rotate(220deg)}
.ball-hole{width:7px; height:7px; border-radius:50%; background:#F3FAFD}

/* ── かんらんしゃ ── */
.wheel-wrap{
  background:var(--paper); border:2px solid var(--line); border-radius:18px;
  padding:16px; display:grid; place-items:center;
}
.wheel{width:100%; max-width:340px; height:auto}
.wheel-rim{fill:none; stroke:#D3DAE1; stroke-width:2.6}
.wheel-spoke{stroke:#D3DAE1; stroke-width:2.4}
.wheel-hub{fill:#B6BFC8}
.wheel-arrow{fill:none; stroke:var(--orange); stroke-width:2.2; stroke-linecap:round}
.wheel-arrowhead{fill:var(--orange)}
.gon-body{transition:fill .3s ease}
.gon-arm{stroke:#FFFFFF; stroke-width:1.9; stroke-linecap:round}
.gon-text{fill:#9AA6B2; font-size:7px; font-weight:800; transition:fill .3s ease}
.gon.is-open .gon-text{fill:#3A2E24}
.gon.is-open .gon-body{animation:gonPop .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes gonPop{from{transform:scale(.7); transform-origin:center} to{transform:scale(1)}}

/* ── あたりバッジ ── */
.atari{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
  animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1}}
.atari-sun{width:210px; height:210px; animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.atari-dot{fill:var(--amber)}
.atari-core{fill:var(--amber)}
.atari-text{position:absolute; text-align:center; color:var(--ink)}
.atari-word{display:block; font-size:34px; font-weight:800; letter-spacing:.06em}
.atari-score{display:inline-block; margin-top:6px; padding:3px 12px;
  border:2.5px solid var(--ink); font-size:14px; font-weight:800}

/* ── 判定カード ── */
.judge-row{display:flex; gap:12px; margin-top:14px; align-items:stretch}
.judge{
  position:relative; width:86px; height:86px; flex:none; border-radius:18px;
  display:grid; place-items:center; border:3px solid var(--line); background:var(--paper);
}
.judge-name{font-size:30px; font-weight:800; color:var(--ink)}
.judge.is-empty .judge-name{color:#CDBFA9}
.judge.is-ok{border-color:var(--mint); animation:okPop .4s cubic-bezier(.2,1.6,.4,1)}
.judge.is-ok .judge-name{color:var(--mint)}
@keyframes okPop{from{transform:scale(.7)} to{transform:scale(1)}}
.judge.is-ng{border-color:var(--red); animation:ngShake .4s ease}
.judge.is-ng .judge-name{color:#B0A18E}
@keyframes ngShake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
.judge-cross{position:absolute; inset:0; width:100%; height:100%}
.judge-cross line{stroke:var(--red); stroke-width:11; stroke-linecap:round;
  stroke-dasharray:96; stroke-dashoffset:96; animation:draw .22s ease forwards}
.judge-cross line:last-child{animation-delay:.14s}
@keyframes draw{to{stroke-dashoffset:0}}
.heard{
  flex:1; padding:12px 14px; border-radius:14px;
  background:var(--paper); border:2px dashed var(--line);
  display:flex; flex-direction:column; justify-content:center; gap:6px; min-width:0;
}
.heard-label{font-size:11px; letter-spacing:.14em; color:var(--sub); font-weight:800}
.heard-text{font-size:18px; font-weight:800; color:var(--mint); word-break:break-all}

/* ── 操作 ── */
.notice{margin:10px 2px 14px; font-size:15px; font-weight:800; color:var(--sub)}
.notice.is-ng{color:var(--red)}
.controls{display:flex; gap:10px; flex-wrap:wrap}
.mic{
  flex:1 1 180px; padding:15px 18px; border:none; border-radius:999px; cursor:pointer;
  background:var(--amber); color:var(--ink); font-size:16px; font-weight:800;
  box-shadow:0 3px 0 #DCA71F;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.mic:hover{transform:translateY(-2px); box-shadow:0 5px 0 #DCA71F}
.mic:active{transform:translateY(2px); box-shadow:0 1px 0 #DCA71F}
.mic:disabled{opacity:.5; cursor:not-allowed; transform:none}
.mic.is-live{background:var(--mint); color:#FFFFFF; box-shadow:0 3px 0 #23917F}
.mic-dot{width:11px; height:11px; border-radius:50%; background:var(--ink); opacity:.3}
.mic.is-live .mic-dot{opacity:1; background:#FFFFFF; animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.ghost{
  padding:15px 20px; border-radius:999px; cursor:pointer; background:var(--paper);
  border:2px solid var(--line); color:var(--sub); font-size:15px; font-weight:800;
}
.ghost:hover{border-color:var(--orange); color:var(--orange)}
.fallback-note{margin:12px 2px 0; font-size:13px; color:var(--red); line-height:1.7}

@media (max-width:420px){
  .lane{height:280px}
  .pin-svg{width:36px; height:92px}
  .pin{width:36px}
  .pin-label{width:27px; height:27px; font-size:12px; top:-10px}
  .judge{width:76px; height:76px}
  .judge-name{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  .app *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
`;
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  } catch (e) {
    showErr('起動エラー: ' + (e && e.message ? e.message : e));
  }
})();
