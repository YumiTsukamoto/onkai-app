<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おんかいボウリング</title>
<style>
  html,body{margin:0;padding:0;background:#141C26;min-height:100%}
  #root{min-height:100vh}
</style>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;


/* ─────────────────────────────────────────────
   音階データ  ド レ ミ ファ ソ ラ シ ド レ
   ───────────────────────────────────────────── */
const SCALE = [
  { ja: "ド", note: "C4" },
  { ja: "レ", note: "D4" },
  { ja: "ミ", note: "E4" },
  { ja: "ファ", note: "F4" },
  { ja: "ソ", note: "G4" },
  { ja: "ラ", note: "A4" },
  { ja: "シ", note: "B4" },
  { ja: "ド", note: "C5" },
  { ja: "レ", note: "D5" },
  { ja: "ミ", note: "E5" },
  { ja: "ファ", note: "F5" },
];
const STARTS = [0, 1, 2, 3, 4, 5, 6]; // ド〜シ から開始
const PIN_COUNT = 5;

/* ─────────────────────────────────────────────
   音声認識テキストの正規化
   STT は「ド」を「度」、「シ」を「四」等に誤変換しがち
   ───────────────────────────────────────────── */
const HOMOPHONE = {
  度: "ド", 土: "ド", 努: "ド", 怒: "ド",
  令: "レ", 礼: "レ", 例: "レ",
  見: "ミ", 実: "ミ", 味: "ミ", 三: "ミ",
  素: "ソ", 祖: "ソ", 想: "ソ",
  等: "ラ", 裸: "ラ",
  四: "シ", 市: "シ", 詩: "シ", 死: "シ", 氏: "シ",
  婦: "ファ", 譜: "ファ",
};
const SINGLE = new Set(["ド", "レ", "ミ", "ソ", "ラ", "シ"]);

function toKatakana(s) {
  return s.replace(/[\u3041-\u3096]/g, (c) =>
    String.fromCharCode(c.charCodeAt(0) + 0x60)
  );
}

/** 認識テキストから音名の並びを取り出す（「ドレミファソ」も1回で拾える） */
function parseNotes(raw) {
  const s = toKatakana(raw).replace(/[\sー・、。,.!?！？]/g, "");
  const out = [];
  let i = 0;
  while (i < s.length) {
    const two = s.slice(i, i + 2);
    if (two === "ファ" || two === "フア") { out.push("ファ"); i += 2; continue; }
    const one = s[i];
    if (SINGLE.has(one)) { out.push(one); i += 1; continue; }
    if (HOMOPHONE[one]) { out.push(HOMOPHONE[one]); i += 1; continue; }
    i += 1;
  }
  return out;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const randomStart = (exclude = -1) => {
  let n = exclude;
  while (n === exclude) n = STARTS[Math.floor(Math.random() * STARTS.length)];
  return n;
};

/* ─────────────────────────────────────────────
   ピン
   ───────────────────────────────────────────── */
function Pin({ label, state, index, revealed }) {
  return (
    <div className={`pin pin--${state}`} style={{ "--i": index }}>
      <div className="pin-inner">
        <div className={`pin-label ${revealed ? "" : "is-hidden"}`}>
          {revealed ? label : "?"}
        </div>
        <svg viewBox="0 0 40 100" className="pin-svg" aria-hidden="true">
          <path
            d="M20 3C26 3 28.5 9 28.5 14.5c0 5-4.5 9-4.5 13.5 0 5 8.5 12 8.5 28.5C32.5 74 27.5 88.5 20 97 12.5 88.5 7.5 74 7.5 56.5 7.5 40 16 33 16 28c0-4.5-4.5-8.5-4.5-13.5C11.5 9 14 3 20 3Z"
            className="pin-body"
          />
          <path d="M13.5 34h13v5.5h-13zM12 42h16v5.5H12z" className="pin-stripe" />
        </svg>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   あたり！バッジ（ワークシートの太陽マーク）
   ───────────────────────────────────────────── */
function AtariBadge({ points }) {
  const rays = Array.from({ length: 16 }, (_, i) => i);
  return (
    <div className="atari" role="status">
      <svg viewBox="0 0 200 200" className="atari-sun" aria-hidden="true">
        {rays.map((i) => {
          const a = (i / rays.length) * Math.PI * 2;
          const x = 100 + Math.cos(a) * 78;
          const y = 100 + Math.sin(a) * 78;
          return <circle key={i} cx={x} cy={y} r={6} className="atari-dot" />;
        })}
        <circle cx="100" cy="100" r="66" className="atari-core" />
      </svg>
      <div className="atari-text">
        <span className="atari-word">あたり！</span>
        <span className="atari-score">{points}てん</span>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   本体
   ───────────────────────────────────────────── */
function OnkaiBowling() {
  const [startIdx, setStartIdx] = useState(() => randomStart());
  const [cleared, setCleared] = useState(0); // 倒れた本数
  const [ballAt, setBallAt] = useState(null); // 転がる先のピン番号
  const [miss, setMiss] = useState(false);
  const [done, setDone] = useState(false);
  const [score, setScore] = useState(0);
  const [listening, setListening] = useState(false);
  const [heard, setHeard] = useState("");
  const [notice, setNotice] = useState("スタートの音をえらんで、マイクをタップ");
  const [srSupported, setSrSupported] = useState(true);
  const [penalty, setPenalty] = useState(0);
  const [lastPoints, setLastPoints] = useState(null);
  const [judge, setJudge] = useState(null); // {name, ok, id}
  const judgeIdRef = useRef(0);

  const target = SCALE.slice(startIdx, startIdx + PIN_COUNT);

  const startRef = useRef(startIdx);
  const idxRef = useRef(0);
  const doneRef = useRef(false);
  const queueRef = useRef([]);
  const runningRef = useRef(false);
  const penaltyRef = useRef(0);
  const recogRef = useRef(null);
  const wantListenRef = useRef(false);
  const synthRef = useRef(null);
  const clackRef = useRef(null);
  const buzzRef = useRef(null);

  useEffect(() => { startRef.current = startIdx; }, [startIdx]);

  /* フォント */
  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap";
    document.head.appendChild(link);
    return () => { try { document.head.removeChild(link); } catch (e) {} };
  }, []);

  /* ── 音まわり ───────────────────────────── */
  const initAudio = useCallback(async () => {
    if (synthRef.current) return;
    await Tone.start();
    synthRef.current = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.005, decay: 0.35, sustain: 0.25, release: 1.1 },
    }).toDestination();
    synthRef.current.volume.value = -6;

    clackRef.current = new Tone.NoiseSynth({
      noise: { type: "white" },
      envelope: { attack: 0.001, decay: 0.09, sustain: 0 },
    }).toDestination();
    clackRef.current.volume.value = -20;

    buzzRef.current = new Tone.Synth({
      oscillator: { type: "sawtooth" },
      envelope: { attack: 0.01, decay: 0.18, sustain: 0 },
    }).toDestination();
    buzzRef.current.volume.value = -16;
  }, []);

  const playNote = useCallback((note) => {
    try {
      synthRef.current?.triggerAttackRelease(note, "8n");
      clackRef.current?.triggerAttackRelease("16n");
    } catch (e) {}
  }, []);

  const playBuzz = useCallback(() => {
    try { buzzRef.current?.triggerAttackRelease("A2", "16n"); } catch (e) {}
  }, []);

  /* ── ゲーム進行 ─────────────────────────── */
  const reset = useCallback(() => {
    queueRef.current = [];
    idxRef.current = 0;
    doneRef.current = false;
    penaltyRef.current = 0;
    setPenalty(0);
    setLastPoints(null);
    setJudge(null);
    setCleared(0);
    setDone(false);
    setBallAt(null);
    setMiss(false);
    setHeard("");
    setNotice("さいしょの おとから じゅんばんに！");
  }, []);

  const handleNote = useCallback(
    async (name) => {
      if (doneRef.current) return;
      const seq = SCALE.slice(startRef.current, startRef.current + PIN_COUNT);
      const i = idxRef.current;
      if (i >= PIN_COUNT) return;

      if (name === seq[i].ja) {
        judgeIdRef.current += 1;
        setJudge({ name, ok: true, id: judgeIdRef.current });
        setNotice("せいかい！");
        setBallAt(i);
        await sleep(300);
        idxRef.current = i + 1;
        setCleared(i + 1);
        playNote(seq[i].note);
        await sleep(240);
        setBallAt(null);
        if (i + 1 === PIN_COUNT) {
          doneRef.current = true;
          const points = Math.max(20, 100 - penaltyRef.current);
          setLastPoints(points);
          setDone(true);
          setScore((s) => s + points);
          setNotice("ぜんぶ たおれた！");
          for (let k = 0; k < PIN_COUNT; k++) {
            playNote(seq[k].note);
            await sleep(150);
          }
        }
        await sleep(120);
      } else {
        judgeIdRef.current += 1;
        setJudge({ name, ok: false, id: judgeIdRef.current });
        penaltyRef.current += 10;
        setPenalty(penaltyRef.current);
        setMiss(true);
        playBuzz();
        setNotice("ざんねん");
        await sleep(900);
        setMiss(false);
      }
    },
    [playNote, playBuzz]
  );

  const drain = useCallback(async () => {
    if (runningRef.current) return;
    runningRef.current = true;
    while (queueRef.current.length) {
      const n = queueRef.current.shift();
      await handleNote(n);
    }
    runningRef.current = false;
  }, [handleNote]);

  const enqueue = useCallback(
    (names) => {
      if (!names.length) return;
      queueRef.current.push(...names);
      drain();
    },
    [drain]
  );

  /* ── 音声認識 ───────────────────────────── */
  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSrSupported(false); return; }
    const r = new SR();
    r.lang = "ja-JP";
    r.continuous = true;
    r.interimResults = true;

    r.onresult = (ev) => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        const text = res[0].transcript;
        if (res.isFinal) {
          setHeard(text);
          enqueue(parseNotes(text));
        } else {
          interim += text;
        }
      }
      if (interim) setHeard(interim);
    };
    r.onerror = (ev) => {
      if (ev.error === "not-allowed") {
        wantListenRef.current = false;
        setListening(false);
        setNotice("マイクの きょかが ひつようです");
      }
    };
    r.onend = () => {
      if (wantListenRef.current) {
        // iOS Safari は1発話ごとに停止する。再開できない場合はタップを促す
        try {
          r.start();
        } catch (e) {
          wantListenRef.current = false;
          setListening(false);
          setNotice("もういちど マイクを タップしてね");
        }
      } else {
        setListening(false);
      }
    };
    recogRef.current = r;
    return () => { wantListenRef.current = false; try { r.stop(); } catch (e) {} };
  }, [enqueue]);

  const toggleMic = useCallback(async () => {
    await initAudio();
    const r = recogRef.current;
    if (!r) return;
    if (listening) {
      wantListenRef.current = false;
      try { r.stop(); } catch (e) {}
      setListening(false);
      setNotice("マイクを とめました");
    } else {
      wantListenRef.current = true;
      try { r.start(); } catch (e) {}
      setListening(true);
      setHeard("");
      setNotice("こえで いってみよう");
    }
  }, [listening, initAudio]);

  const nextQuestion = useCallback(() => {
    setStartIdx((cur) => randomStart(cur));
    reset();
  }, [reset]);

  const pinX = (i) => 32 + i * 9; // レーン上の横位置(%)

  return (
    <div className="app">
      <style>{CSS}</style>

      {/* スコアボード */}
      <header className="board">
        <div className="board-left">
          <span className="board-eyebrow">もんだい</span>
          <h1 className="board-title">
            {target.map((t, i) => (
              <span
                key={i}
                className={`slot ${i < cleared ? "is-open" : ""} ${i === 0 ? "is-given" : ""}`}
              >
                {i === 0 || i < cleared ? t.ja : "?"}
              </span>
            ))}
          </h1>
        </div>
        <div className="board-score">
          <span className="board-score-label">とくてん</span>
          <span className="board-score-num">{String(score).padStart(3, "0")}</span>
          {!done && penalty > 0 && (
            <span className="board-penalty">このもんだい −{penalty}</span>
          )}
        </div>
      </header>

      {/* レーン */}
      <main className={`lane-wrap ${miss ? "is-miss" : ""}`}>
        <div className="lane">
          <div className="lane-boards" />
          <div className="lane-arrows">
            {[0, 1, 2].map((i) => <span key={i} className="arrow" />)}
          </div>

          <div className="pins">
            {target.map((t, i) => (
              <div key={i} className="pin-slot" style={{ left: `${pinX(i)}%` }}>
                <Pin
                  label={t.ja}
                  index={i}
                  revealed={i === 0 || i < cleared}
                  state={i < cleared ? "down" : ballAt === i ? "hit" : "up"}
                />
              </div>
            ))}
          </div>

          <div
            className={`ball ${ballAt !== null ? "is-rolling" : ""}`}
            style={ballAt !== null ? { left: `${pinX(ballAt)}%` } : undefined}
          >
            <span className="ball-hole" />
            <span className="ball-hole" />
            <span className="ball-hole" />
          </div>
        </div>

        {done && <AtariBadge points={lastPoints ?? 100} />}
      </main>

      {/* 入力された音名と判定 */}
      <div className="judge-row" aria-live="polite">
        <div className="judge-slot">
          {judge ? (
            <div
              key={judge.id}
              className={`judge ${judge.ok ? "is-ok" : "is-ng"}`}
            >
              <span className="judge-name">{judge.name}</span>
              {!judge.ok && (
                <svg viewBox="0 0 100 100" className="judge-cross" aria-hidden="true">
                  <line x1="16" y1="16" x2="84" y2="84" />
                  <line x1="84" y1="16" x2="16" y2="84" />
                </svg>
              )}
            </div>
          ) : (
            <div className="judge is-empty"><span className="judge-name">—</span></div>
          )}
        </div>
        <div className="heard">
          <span className="heard-label">きこえたことば</span>
          <span className="heard-text">{heard || "—"}</span>
        </div>
      </div>

      <p className={`notice ${judge && !judge.ok ? "is-ng" : ""}`} aria-live="polite">
        {notice}
      </p>

      {/* 操作 */}
      <div className="controls">
        <button
          className={`mic ${listening ? "is-live" : ""}`}
          onClick={toggleMic}
          disabled={!srSupported}
        >
          <span className="mic-dot" />
          {listening ? "きいています" : "マイクを つかう"}
        </button>
        <button className="ghost" onClick={nextQuestion}>つぎのもんだい</button>
      </div>

      {!srSupported && (
        <p className="fallback-note">
          このブラウザは音声にんしきに たいおうしていません。Chrome か Edge、
          または iPhone は Safari でひらいてください。
        </p>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   スタイル
   ───────────────────────────────────────────── */
const CSS = `
.app{
  --night:#141C26; --night-2:#1D2836;
  --lane:#E2A751; --lane-2:#C1802F; --gutter:#223143;
  --pin:#FBF6EC; --stripe:#E2453C;
  --amber:#FFC145; --mint:#4FD1C5; --ink:#0E141C;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  background:var(--night); color:var(--pin);
  min-height:100%; padding:18px 16px 28px; box-sizing:border-box;
  max-width:720px; margin:0 auto;
}
.app *{box-sizing:border-box}
.app button:focus-visible{outline:3px solid var(--mint); outline-offset:3px}

/* スコアボード */
.board{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--night-2); border:2px solid #2E3D4F; border-radius:14px;
  padding:12px 16px;
}
.board-eyebrow{
  display:block; font-size:11px; letter-spacing:.22em; color:#7D8FA3; font-weight:800;
}
.board-title{
  margin:4px 0 0; font-size:26px; font-weight:800; letter-spacing:.14em; color:var(--pin);
}
.board-title{display:flex; gap:6px; letter-spacing:0}
.slot{
  min-width:38px; padding:2px 4px; border-radius:8px; text-align:center;
  background:#26374A; color:#6F8398; border:2px solid #35485E;
  transition:background .25s ease, color .25s ease, transform .25s ease;
}
.slot.is-given{background:transparent; color:var(--pin); border-color:#5A6E86; border-style:dashed}
.slot.is-open{background:var(--amber); color:var(--ink); border-color:var(--amber); border-style:solid; transform:translateY(-2px)}
.board-score{text-align:right; line-height:1}
.board-penalty{display:block; margin-top:5px; font-size:11px; font-weight:800; color:#E2453C}
.board-score-label{display:block; font-size:10px; letter-spacing:.2em; color:#7D8FA3; font-weight:800}
.board-score-num{
  font-size:32px; font-weight:800; color:var(--amber); letter-spacing:.06em;
  text-shadow:0 0 14px rgba(255,193,69,.45);
}


/* レーン */
.lane-wrap{position:relative; margin-top:14px}
.lane-wrap.is-miss{animation:shake .4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)}
}
.lane{
  position:relative; height:340px; border-radius:14px; overflow:hidden;
  background:var(--gutter);
}
.lane-boards{
  position:absolute; inset:0;
  clip-path:polygon(36% 6%, 64% 6%, 100% 100%, 0% 100%);
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 26px),
    linear-gradient(180deg, var(--lane-2) 0%, var(--lane) 55%, #EFBD6E 100%);
}
.lane-arrows{
  position:absolute; left:0; right:0; bottom:24%; display:flex;
  justify-content:center; gap:38px; pointer-events:none;
}
.arrow{
  width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;
  border-bottom:16px solid rgba(20,28,38,.28);
}
.pins{position:absolute; inset:0}
.pin-slot{position:absolute; top:8%; transform:translateX(-50%)}

.pin{width:44px; transform-origin:50% 100%}
.pin-inner{
  position:relative; transform-origin:50% 100%;
  transition:transform .34s cubic-bezier(.3,1.4,.5,1), opacity .34s ease;
}
.pin-svg{display:block; width:44px; height:110px; filter:drop-shadow(0 6px 6px rgba(0,0,0,.28))}
.pin-body{fill:var(--pin)}
.pin-stripe{fill:var(--stripe)}
.pin-label{
  position:absolute; top:-14px; left:50%; transform:translateX(-50%);
  width:34px; height:34px; border-radius:50%;
  background:var(--pin); border:2.5px solid var(--ink); color:var(--ink);
  font-size:15px; font-weight:800; display:grid; place-items:center; z-index:2;
}
.pin-label.is-hidden{background:#33475D; color:#9FB2C6; border-color:#0E141C}
.pin--hit .pin-inner{transform:translateY(-4px) rotate(-4deg)}
.pin--down .pin-inner{transform:rotate(-82deg) translate(-16px,10px); opacity:.55}

/* ボール */
.ball{
  position:absolute; left:50%; bottom:6%; width:62px; height:62px; margin-left:-31px;
  border-radius:50%; background:radial-gradient(circle at 32% 28%, #4B6E92, #16243A 70%);
  box-shadow:0 8px 14px rgba(0,0,0,.4), inset -6px -8px 14px rgba(0,0,0,.4);
  transition:left .3s ease-out, bottom .3s ease-out, transform .3s ease-out;
  display:flex; gap:4px; align-items:center; justify-content:center; padding-bottom:10px;
}
.ball.is-rolling{bottom:60%; transform:scale(.5) rotate(220deg)}
.ball-hole{width:8px; height:8px; border-radius:50%; background:#0C1420}

/* あたりバッジ */
.atari{
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
  animation:pop .45s cubic-bezier(.2,1.5,.4,1);
}
@keyframes pop{from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1}}
.atari-sun{width:230px; height:230px; animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.atari-dot{fill:var(--pin)}
.atari-core{fill:var(--pin)}
.atari-text{position:absolute; text-align:center; color:var(--ink)}
.atari-word{display:block; font-size:38px; font-weight:800; letter-spacing:.06em}
.atari-score{
  display:inline-block; margin-top:6px; padding:3px 12px; border:2.5px solid var(--ink);
  font-size:15px; font-weight:800;
}

/* 認識テキスト */
/* 判定カード */
.judge-row{display:flex; gap:12px; margin-top:14px; align-items:stretch}
.judge-slot{flex:none}
.judge{
  position:relative; width:92px; height:92px; border-radius:16px;
  display:grid; place-items:center; border:3px solid #38495D; background:var(--night-2);
}
.judge-name{font-size:34px; font-weight:800; letter-spacing:.02em}
.judge.is-empty .judge-name{color:#4E617A}
.judge.is-ok{
  border-color:var(--mint); color:var(--mint);
  animation:okPop .4s cubic-bezier(.2,1.6,.4,1);
}
@keyframes okPop{from{transform:scale(.7)} to{transform:scale(1)}}
.judge.is-ng{
  border-color:var(--stripe); color:#8FA3B8;
  animation:ngShake .4s ease;
}
@keyframes ngShake{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
}
.judge-cross{position:absolute; inset:0; width:100%; height:100%}
.judge-cross line{
  stroke:var(--stripe); stroke-width:11; stroke-linecap:round;
  stroke-dasharray:96; stroke-dashoffset:96; animation:draw .22s ease forwards;
}
.judge-cross line:last-child{animation-delay:.14s}
@keyframes draw{to{stroke-dashoffset:0}}

.heard{
  margin-top:0; flex:1; padding:12px 14px; border-radius:12px;
  background:var(--night-2); border:2px dashed #38495D;
  display:flex; flex-direction:column; justify-content:center; gap:6px;
}
.heard-label{font-size:11px; letter-spacing:.16em; color:#7D8FA3; font-weight:800; flex:none}
.heard-text{font-size:19px; font-weight:800; color:var(--mint); word-break:break-all}
.notice{margin:10px 2px 16px; font-size:15px; font-weight:800; color:#B9C8D8}
.notice.is-ng{color:var(--stripe)}

/* 操作 */
.controls{display:flex; gap:10px; flex-wrap:wrap}
.mic{
  flex:1 1 190px; padding:15px 18px; border:none; border-radius:999px; cursor:pointer;
  background:var(--amber); color:var(--ink); font-family:inherit; font-size:17px; font-weight:800;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .12s ease, filter .12s ease;
}
.mic:hover{transform:translateY(-2px)}
.mic:disabled{opacity:.45; cursor:not-allowed; transform:none}
.mic.is-live{background:var(--mint)}
.mic-dot{width:11px; height:11px; border-radius:50%; background:var(--ink); opacity:.35}
.mic.is-live .mic-dot{opacity:1; background:#8A1F1A; animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.ghost{
  padding:15px 20px; border-radius:999px; cursor:pointer; background:transparent;
  border:2px solid #38495D; color:#A8BACD; font-family:inherit; font-size:15px; font-weight:800;
}
.ghost:hover{border-color:var(--mint); color:var(--mint)}
.ghost:disabled{opacity:.4; cursor:not-allowed}
.ghost:disabled:hover{border-color:#38495D; color:#A8BACD}
.fallback-note{margin:12px 2px 0; font-size:13px; color:#E2A751; line-height:1.7}


@media (max-width:420px){
  .board-title{font-size:20px}
  .lane{height:290px}
  .pin-svg{width:38px; height:95px}
  .pin{width:38px}
  .pin-label{width:29px; height:29px; font-size:13px; top:-11px}
}
@media (prefers-reduced-motion:reduce){
  .app *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
`;
